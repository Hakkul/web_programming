<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Profil Github</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="shortcut icon" href="assets/favicon/search.png" type="image/x-icon">
</head>
<body>

    <div class="container">
        <div class="hide" id="missing-container">
            <h1>Search Profil GitHub</h1>
        <!-- Img github -->
        <div> <img src="assets/img/github.png" alt="img"></div>
             </div>
        <!-- Form Pencarian -->
        <form id="search-form">
            <input type="text" id="username-input" placeholder="Masukkan username GitHub..." autocomplete="off" required>
            <button type="submit">Cari</button>
        </form>

        <!-- bagian Loading -->
        <div id="loading" class="hidden">Mencari username... Wait!</div>

        <!-- Pesan Error / User Tidak Ditemukan -->
        <div id="error-message" class="hidden"></div>

        <!-- Button khusus eror -->
         <button type="reset" id="btn-erorr" class="hidden">Cari Username Lain</button>

        <!-- img 404 -->

        <img src="assets/img/notFoud.png" alt="username tidak ditemukan" class="hidden" id="img-erorr">

        <!-- card hasil profil -->
        <div id="profile-container" class="hidden">
            <img id="profile-avatar" src="none" alt="Avatar">
            <h2 id="profile-name">profil github</h2>
            <p id="profile-username"></p>
            <p id="profile-bio"></p>
            <div class="profile-info">
                <span>Repositori Publik: <strong id="profile-repos"></strong></span>
            </div>
            <a id="profile-link" href="" target="_blank">Kunjungi Profil GitHub</a>
            <button type="reset" id="back-btn" class="back-button">Cari github lain</button>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
