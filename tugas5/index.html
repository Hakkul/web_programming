<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Profil Github</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="shortcut icon" href="assets/favicon/icon.png" type="image/x-icon">
</head>
<body>

    <div class="container">
        <div class="hide" id="missing-container">
            <h1>Search profil github</h1>
        <!-- Img github -->
        <div> <img src="assets/img/github.png" alt="img"></div>
             </div>
        <!-- Form Pencarian -->
        <form id="search-form">
            <input type="text" id="username-input" placeholder="Masukkan username GitHub..." autocomplete="off" required>
            <button type="submit">Cari</button>
        </form>

        <!-- Loading -->
        <div id="loading" class="hidden">Mencari username... Wait!</div>
        <div class="hidden" id="search-hidden">
            <img src="assets/favicon/search.png" alt="seaech" class="search_hidden">
        </div>

        <div id="error-container" class="hidden">
            <div id="error-message"></div>
            <img src="assets/img/eror404.png" alt="username tidak ditemukan" id="img-erorr">
            <button type="button" id="btn-erorr" class="back-button">Cari Username Lain</button>
        </div>

     <div id="profile-container" class="hidden">
        <img id="profile-avatar" src="/" alt="Avatar">
        <h2 id="profile-name">profil github</h2>
        <p id="profile-username"></p>
        <p id="profile-bio"></p>
        <!-- Informasi Tanggal Bergabung -->
        <p id="profile-join" class="profile-joined-text"></p>

        <!-- Kotak Statistik (Repo, Followers, Following) -->
        <div class="profile-stats">
            <div class="stat-item">
                <span>Repo</span>
                <strong id="profile-repos">0</strong>
            </div>
            <div class="stat-item">
                <span>Followers</span>
                <strong id="profile-followers">0</strong>
            </div>
            <div class="stat-item">
                <span>Following</span>
                <strong id="profile-following">0</strong>
            </div>
        </div>

        <a id="profile-link" href="" target="_blank">Kunjungi Profil GitHub</a>
        <button type="reset" id="back-btn" class="back_button">Cari github lain</button>
    </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
